<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="500" height="320" fill="#f8fafc"/>
  <!-- iPhone frame -->
  <g>
    <rect x="180" y="30" width="140" height="260" rx="22" fill="#0f172a"/>
    <rect x="188" y="44" width="124" height="232" rx="6" fill="#1e293b"/>
    <!-- AR scene -->
    <rect x="188" y="44" width="124" height="232" rx="6" fill="url(#arGrad)"/>
    <defs>
      <linearGradient id="arGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e3a8a"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>
    </defs>
    <!-- floor grid -->
    <g stroke="#3b82f6" stroke-width="0.6" opacity="0.5">
      <line x1="188" y1="220" x2="312" y2="220"/>
      <line x1="188" y1="240" x2="312" y2="240"/>
      <line x1="188" y1="260" x2="312" y2="260"/>
      <line x1="210" y1="200" x2="200" y2="276"/>
      <line x1="250" y1="200" x2="250" y2="276"/>
      <line x1="290" y1="200" x2="300" y2="276"/>
    </g>
    <!-- ball -->
    <circle cx="250" cy="190" r="14" fill="#facc15"/>
    <circle cx="246" cy="186" r="4" fill="#fef9c3"/>
    <!-- finder reticle -->
    <g stroke="#22d3ee" stroke-width="2" fill="none">
      <circle cx="250" cy="190" r="30" stroke-dasharray="4 4"/>
      <line x1="220" y1="190" x2="230" y2="190"/>
      <line x1="270" y1="190" x2="280" y2="190"/>
      <line x1="250" y1="160" x2="250" y2="170"/>
      <line x1="250" y1="210" x2="250" y2="220"/>
    </g>
    <text x="250" y="76" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#fff">Ball Finder</text>
    <text x="250" y="92" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="9" fill="#94a3b8">AR Mini-Game</text>
    <!-- score -->
    <rect x="200" y="244" width="100" height="22" rx="11" fill="rgba(255,255,255,0.15)"/>
    <text x="250" y="260" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#fff">Score: 03</text>
  </g>
  <!-- Vibe coding badge -->
  <g>
    <rect x="60" y="140" width="100" height="40" rx="20" fill="#000"/>
    <text x="110" y="165" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#fff">Vibe Code</text>
  </g>
  <path d="M 160 160 L 180 160" stroke="#000" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
  </defs>
</svg>
