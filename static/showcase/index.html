<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PilotDeck - AI Agent Case Showcase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#ffffff;--card:#ffffff;--card-border:#e5e7eb;
  --text:#1f2340;--text-dim:#515154;--accent:#2563eb;
  --accent2:#00cec9;--accent3:#fd79a8;--accent4:#fdcb6e;
  --user-bubble:rgba(9,132,227,0.15);--user-border:rgba(9,132,227,0.4);
  --ai-bubble:rgba(0,184,148,0.12);--ai-border:rgba(0,184,148,0.3);
  --tool-bubble:rgba(225,112,85,0.08);--tool-border:rgba(225,112,85,0.25);
  --summary-bubble:rgba(108,92,231,0.15);--summary-border:rgba(108,92,231,0.4);
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:#ffffff;color:#1f2340;min-height:100vh;overflow-x:hidden;
}
body.detail-mode{background:#ffffff !important;}

/* --- NAV --- */
nav{
  position:sticky;top:0;z-index:100;
  background:#ffffff;backdrop-filter:blur(20px);
  border-bottom:1px solid #e5e7eb;
  padding:0 2rem;height:56px;display:flex;align-items:center;justify-content:space-between;
}
.logo{
  display:flex;align-items:center;gap:.5rem;cursor:pointer;
}
.logo img{height:32px;}
.logo-text{font-size:.95rem;font-weight:700;color:#1f2340;margin-left:.5rem;}
.back-btn{
  background:transparent;border:1px solid #d1d5db;color:#374151;
  padding:.4rem 1rem;border-radius:8px;cursor:pointer;font-size:.85rem;
  display:none;align-items:center;gap:.4rem;transition:all .2s;
}
.back-btn:hover{background:#f3f4f6;border-color:#9ca3af;}
.back-btn.visible{display:flex;color:#1f2340;}

/* ===== HOME VIEW ===== */
#homeView{display:block;}

.hero{
  text-align:center;padding:4rem 2rem 2.5rem;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%,rgba(108,92,231,0.12),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(0,206,201,0.06),transparent);
}
.hero h1{
  font-size:clamp(2rem,5vw,3rem);font-weight:800;line-height:1.2;
  margin-bottom:.75rem;
  background:linear-gradient(135deg,#fff 30%,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.hero p{
  font-size:1rem;color:var(--text-dim);max-width:560px;margin:0 auto;line-height:1.7;
}

/* --- CARDS GRID --- */
.card-container{max-width:1200px;margin:0 auto;padding:1rem 2rem 4rem;}
.card-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1.5rem;
}
.card{
  background:#fff;border:1px solid #e5e7eb;
  border-radius:16px;overflow:hidden;cursor:pointer;
  transition:all .35s cubic-bezier(.4,0,.2,1);position:relative;
}
.card:hover{
  transform:translateY(-4px);border-color:#d1d5db;
  box-shadow:0 8px 30px rgba(0,0,0,0.08);
}
.card-preview{
  width:100%;aspect-ratio:16/9;background:#f7f7fa;
  border-bottom:1px solid #e5e7eb;overflow:hidden;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.thumb-fallback{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#f7f7fa;
}
.card-preview img.card-thumb{
  width:100%;height:100%;object-fit:cover;position:absolute;inset:0;
}
.card-preview iframe{
  width:100%;height:100%;border:none;
}
.card-preview iframe[src=""]{display:none;}
.card-preview-fallback{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#f7f7fa;
}
.card-preview-fallback svg{width:100%;height:100%;}
.card-preview-fallback img{width:100%;height:100%;object-fit:cover;}
.card-preview-label{
  position:absolute;bottom:0;left:0;right:0;
  padding:.35rem .65rem;font-size:.65rem;color:#515154;
  background:linear-gradient(transparent,rgba(255,255,255,0.95))transparent,rgba(0,0,0,0.7));
  display:flex;align-items:center;gap:.35rem;
}
.card-label-icon{opacity:.6;}
.card-info{padding:1.25rem;}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem;}
.card-title{font-size:1.1rem;font-weight:700;}
.card-badge{
  font-size:.65rem;font-weight:600;padding:.2rem .55rem;border-radius:20px;white-space:nowrap;
}
.badge-game{background:#f3f0ff;color:#6c5ce7;}
.badge-media{background:#fef0f5;color:#fd79a8;}
.badge-interactive{background:#e0fffe;color:#00cec9;}
.badge-tool{background:#fff8e1;color:#e6a817;}
.card-desc{
  font-size:.85rem;color:#515154;line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}

/* ===== DETAIL VIEW ===== */
#detailView{
  display:none;
  height:calc(100vh - 56px);
  overflow:hidden;
  background:#ffffff;
}
#detailView.active{display:flex;}
.detail-split{
  display:flex;width:100%;height:100%;
}

/* Left panel — Preview */
.detail-left{
  flex:5.5;min-width:0;overflow-y:auto;
  padding:2.5rem 3rem;
  border-right:1px solid #e5e7eb;
  background:#ffffff;
}
.detail-hero-capture{
  width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;
  margin-bottom:2rem;border:1px solid #e5e7eb;
  box-shadow:0 4px 24px rgba(0,0,0,0.06);
  background:#f7f7fa;
}
.detail-hero-capture svg{width:100%;height:100%;}
.detail-hero-capture iframe{width:100%;height:100%;border:none;}
.detail-hero-capture img{width:100%;height:100%;object-fit:cover;}
.detail-name{
  font-size:clamp(1.8rem,3vw,2.2rem);
  font-weight:800;
  margin-bottom:.6rem;
  color:#1f2340;
  letter-spacing:-0.5px;
  line-height:1.2;
}
.detail-category{
  display:inline-block;font-size:.78rem;font-weight:600;padding:.3rem .75rem;
  border-radius:6px;margin-bottom:1rem;background:#eff6ff;color:#2563eb;
}
.detail-desc{
  font-size:1rem;color:#515154;line-height:1.75;margin-bottom:1.75rem;
}
.detail-stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:2rem;
}
.stat-card{
  background:#f7f7fa;border:1px solid #e5e7eb;
  border-radius:12px;padding:1.2rem 1rem;text-align:center;
}
.stat-card .stat-num{
  font-size:1.6rem;font-weight:800;color:#1f2340;
}
.stat-card .stat-label{font-size:.75rem;color:#8888a0;margin-top:.35rem;font-weight:500;}
.detail-actions{
  display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.5rem;
}
.btn-preview{
  background:#2563eb;color:#fff;
  border:none;padding:.6rem 1.4rem;border-radius:8px;font-size:.85rem;
  font-weight:600;cursor:pointer;transition:all .2s;
}
.btn-preview:hover{background:#1d4ed8;box-shadow:0 4px 12px rgba(37,99,235,0.2);}
.btn-variant{
  padding:.5rem 1rem;font-size:.82rem;
  background:transparent;border:1px solid #d1d5db;
  color:#374151;border-radius:8px;cursor:pointer;transition:all .2s;font-weight:500;
}
.btn-variant:hover{background:#f3f4f6;border-color:#9ca3af;}
.detail-section-title{
  font-size:.75rem;color:#515154;font-weight:700;margin-bottom:.5rem;
  text-transform:uppercase;letter-spacing:1.5px;
}
.detail-flowchart{
  border-radius:12px;overflow:hidden;border:1px solid #e5e7eb;
  background:#f7f7fa;
}

/* ===== Chat Styles ===== */
.detail-right{
  flex:4.5;min-width:0;display:flex;flex-direction:column;
  background:#ffffff;
}
.chat-header{
  flex-shrink:0;
  padding:1rem 1.5rem;
  border-bottom:1px solid var(--glass-border);
  display:flex;align-items:center;gap:.5rem;
}
.chat-header h3{font-size:.95rem;font-weight:700;}
.chat-header .session-badge{
  font-size:.65rem;padding:.2rem .5rem;border-radius:12px;
  background:rgba(108,92,231,0.15);color:var(--accent);font-weight:600;
}
.chat-messages{
  flex:1;overflow-y:auto;padding:1.5rem;display:flex;flex-direction:column;gap:1.25rem;
}

@keyframes msgIn{
  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

/* ===== USER MESSAGES (right-aligned) ===== */
.msg-user{
  align-self:flex-end;max-width:88%;
  background:var(--user-bubble);border:1px solid var(--user-border);
  border-radius:16px 16px 4px 16px;padding:.9rem 1.15rem;
  animation:msgIn .4s ease both;
}
.msg-user .msg-title{
  font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  margin-bottom:.4rem;color:#74b9ff;opacity:.7;
}
.msg-user .msg-body{
  font-size:.88rem;line-height:1.65;color:var(--text);white-space:pre-wrap;word-break:break-word;
}

/* ===== ASSISTANT MESSAGES (left-aligned, Markdown rendered) ===== */
.msg-assistant{
  align-self:flex-start;max-width:90%;
  animation:msgIn .4s ease both;
}
.msg-assistant .msg-bubble{
  background:rgba(0,184,148,0.08);border:1px solid rgba(0,184,148,0.15);
  border-radius:16px 16px 16px 4px;padding:1rem 1.2rem;
}
.msg-assistant .msg-title{
  font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;
  margin-bottom:.5rem;color:#55efc4;opacity:.7;
}
.msg-assistant .msg-body{
  font-size:.88rem;line-height:1.7;color:var(--text);
}

/* Markdown rendering styles */
.msg-body p{margin-bottom:.6rem;}
.msg-body p:last-child{margin-bottom:0;}
.msg-body strong{font-weight:700;}
.msg-body em{font-style:italic;}
.msg-body ul,.msg-body ol{margin:.4rem 0 .6rem 1.2rem;padding-left:.5rem;}
.msg-body li{margin-bottom:.25rem;font-size:.85rem;}
.msg-body code{
  font-family:'Fira Code','Cascadia Code',monospace;
  background:rgba(0,0,0,.35);padding:.15rem .35rem;border-radius:4px;
  font-size:.8rem;color:var(--accent4);
}
.msg-body pre{
  background:rgba(0,0,0,.4);padding:.8rem 1rem;border-radius:8px;
  overflow-x:auto;margin:.6rem 0;
}
.msg-body pre code{
  background:none;padding:0;color:var(--text);font-size:.78rem;
}
.msg-body blockquote{
  border-left:3px solid var(--accent);padding:.4rem .8rem;margin:.5rem 0;
  color:var(--text-dim);background:rgba(108,92,231,0.05);border-radius:0 6px 6px 0;
}
.msg-body table{
  border-collapse:collapse;margin:.6rem 0;width:100%;font-size:.82rem;
}
.msg-body th,.msg-body td{
  border:1px solid rgba(255,255,255,.1);padding:.4rem .6rem;text-align:left;
}
.msg-body th{background:rgba(108,92,231,.1);color:#1f2340;font-weight:600;}
.msg-body hr{border:none;border-top:1px solid rgba(255,255,255,.1);margin:.8rem 0;}
.msg-body h1,.msg-body h2,.msg-body h3,.msg-body h4{
  font-size:1rem;font-weight:700;margin:.6rem 0 .3rem;color:var(--text);
}
.msg-body h1{font-size:1.2rem;}
.msg-body h2{font-size:1.1rem;}

/* ===== TOOL CALL MESSAGES (collapsible) ===== */
.msg-tool{
  align-self:flex-start;max-width:94%;
  animation:msgIn .4s ease both;
}
.msg-tool .tool-header{
  display:flex;align-items:center;gap:.5rem;cursor:pointer;
  padding:.7rem 1rem;border-radius:12px;
  background:rgba(225,112,85,0.06);border:1px solid rgba(225,112,85,0.2);
  transition:background .2s;user-select:none;
}
.msg-tool .tool-header:hover{background:rgba(225,112,85,0.12);}
.msg-tool .tool-toggle{
  width:18px;height:18px;display:flex;align-items:center;justify-content:center;
  color:var(--accent4);font-size:.7rem;transition:transform .2s;flex-shrink:0;
}
.msg-tool .tool-toggle.open{transform:rotate(90deg);}
.msg-tool .tool-icon{font-size:.9rem;flex-shrink:0;}
.msg-tool .tool-title{
  font-size:.78rem;font-weight:600;color:#fab1a0;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;flex:1;
}
.msg-tool .tool-summary{
  font-size:.68rem;color:var(--text-dim);flex-shrink:0;
}
.msg-tool .tool-body{
  display:none;
  padding:.6rem .8rem;margin-top:0;border-radius:0 0 10px 10px;
  background:rgba(0,0,0,.35);
  font-family:'Fira Code','Cascadia Code',monospace;font-size:.75rem;
  color:var(--accent4);line-height:1.5;
  max-height:500px;overflow-y:auto;white-space:pre-wrap;word-break:break-all;
  border:1px solid transparent;border-top:1px solid rgba(225,112,85,0.15);
  border-radius:0 0 10px 10px;
}
.msg-tool .tool-body.open{display:block;}

/* ===== SUMMARY MESSAGES ===== */
.msg-summary{
  align-self:center;max-width:90%;
  background:var(--summary-bubble);border:1px solid var(--summary-border);
  border-radius:14px;padding:1rem 1.2rem;text-align:center;
  animation:msgIn .4s ease both;
}
.msg-summary .msg-title{
  font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
  margin-bottom:.35rem;color:#a29bfe;opacity:.7;
}
.msg-summary .msg-body{
  font-size:.88rem;line-height:1.6;color:var(--text);white-space:pre-wrap;
}

/* ===== SCROLLBAR ===== */
.chat-messages::-webkit-scrollbar,.detail-left::-webkit-scrollbar{width:5px;}
.chat-messages::-webkit-scrollbar-track,.detail-left::-webkit-scrollbar-track{background:transparent;}
.detail-right::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15) !important;border-radius:3px;}
.chat-messages::-webkit-scrollbar-thumb,.detail-left::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px;}
.chat-messages::-webkit-scrollbar-thumb:hover,.detail-left::-webkit-scrollbar-thumb:hover{background:rgba(0,0,0,0.25);}

/* ===== Footer ===== */
footer{text-align:center;padding:2rem;border-top:1px solid var(--glass-border);color:var(--text-dim);font-size:.8rem;}

/* ===== Preview overlay ===== */
.preview-overlay{
  position:fixed;inset:0;z-index:2000;background:#0a0a0f;display:flex;flex-direction:column;
}
.preview-overlay .preview-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:.75rem 1.5rem;background:#fff;border-bottom:1px solid #e5e7eb;flex-shrink:0;
}
.preview-overlay iframe{flex:1;border:none;}

/* ===== Responsive ===== */

/* Light theme overrides for chat in detail-right */
.detail-right .chat-header h3{color:#1f2340 !important;}
.detail-right .session-badge{color:#2563eb !important;background:#eff6ff !important;}
.detail-right .chat-msg{color:#1f2340 !important;}
.detail-right .chat-msg.user{background:rgba(37,99,235,0.06) !important;border-color:rgba(37,99,235,0.2) !important;}
.detail-right .chat-msg.assistant{background:rgba(13,148,136,0.06) !important;border-color:rgba(13,148,136,0.2) !important;}
.detail-right .chat-msg.tool{background:rgba(217,119,6,0.05) !important;border-color:rgba(217,119,6,0.2) !important;}
.detail-right .chat-msg.summary{background:rgba(108,92,231,0.06) !important;border-color:rgba(108,92,231,0.2) !important;}
.detail-right .msg-label{color:#8888a0 !important;}
.detail-right .msg-content{color:#1f2340 !important;}
.detail-right .msg-content code{color:#e17055 !important;background:rgba(0,0,0,0.05) !important;}
.detail-right .msg-content pre{background:rgba(0,0,0,0.04) !important;}
.detail-right .msg-content pre code{color:#1f2340 !important;}
.detail-right .msg-content strong{color:#1f2340 !important;}
.detail-right .msg-content em{color:#374151 !important;}
.detail-right .msg-content h1,.detail-right .msg-content h2,.detail-right .msg-content h3,.detail-right .msg-content h4{color:#1f2340 !important;}
.detail-right .msg-content table th{color:#1f2340 !important;}
.detail-right .chat-footer{color:#8888a0 !important;}
.detail-right .btn-toggle{color:#2563eb !important;}
.detail-right .btn-toggle.active{color:#1d4ed8 !important;background:rgba(37,99,235,0.1) !important;}
.detail-right .msg-toggle-icon{color:#8888a0 !important;}
.docs-btn{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.4rem 1rem;font-size:.82rem;font-weight:600;
  color:#2563eb;background:transparent;border:1px solid #2563eb;
  border-radius:8px;text-decoration:none;transition:all .2s;margin-right:.5rem;
}
.docs-btn:hover{background:#2563eb;color:#fff;}
.lang-switch{display:flex;align-items:center;gap:.25rem;background:transparent;border:1px solid #d1d5db;border-radius:8px;overflow:hidden;cursor:pointer;}
.lang-switch button{padding:.3rem .65rem;font-size:.78rem;font-weight:600;border:none;background:transparent;color:#374151;cursor:pointer;transition:all .15s;}
.lang-switch button.active{background:#2563eb;color:#fff;}
.lang-switch button:hover:not(.active){background:#f3f4f6;}

@media(max-width:900px){
  .detail-split{flex-direction:column;}
  .detail-left{flex:none;border-right:none;border-bottom:1px solid var(--glass-border);max-height:50vh;}
  .detail-right{flex:1;min-height:0;}
  #detailView{height:auto;min-height:calc(100vh - 56px);}
  .chat-messages{max-height:50vh;}
  .card-grid{grid-template-columns:1fr;}
}
@media(max-width:768px){
  nav{padding:0 1rem;}
  .hero{padding:2.5rem 1.5rem 2rem;}
  .card-container{padding:1rem 1rem 3rem;}
  .detail-left{padding:1.25rem;}
}
</style>
</head>
<body>

<nav>
  <div class="logo" onclick="goHome()"><img src="logo.png" alt="PilotDeck" style="height:32px;"></div>
  <button class="back-btn" id="backBtn" onclick="goHome()">&#8592; <span data-i18n="back">返回</span></button>
  <div style="display:flex;align-items:center;gap:.5rem;">
    <a href="/pages/introduction" class="docs-btn">📖 Docs</a>
    <div class="lang-switch" id="langSwitch">
    <button class="active" data-lang="zh" onclick="switchLang('zh')">中文</button>
    <button data-lang="en" onclick="switchLang('en')">EN</button>
  </div>
  </div>
</nav>

<!-- ===== HOME VIEW ===== -->
<div id="homeView">
  <section class="hero">
    <h1 data-i18n="heroTitle">AI Agent 案例广场</h1>
    <p data-i18n="heroDesc">探索由 PilotDeck AI Agent 驱动的完整项目案例</p>
  </section>
  <div class="card-container">
    <div class="card-grid" id="cardGrid"></div>
  </div>
  <footer>&copy; 2026 PilotDeck — <span data-i18n="footer">AI-Powered Case Showcase</span></footer>
</div>

<!-- ===== DETAIL VIEW ===== -->
<div id="detailView">
  <div class="detail-split">
    <div class="detail-left" id="detailLeft"></div>
    <div class="detail-right">
      <div class="chat-header">
        <h3>📋 <span data-i18n="chatTitle">交互过程</span></h3>
        <span class="session-badge" id="sessionBadge"></span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
    </div>
  </div>
</div>

<script src="data/cases-enhanced.js"></script>
<script src="data/cases-flowcharts.js"></script>
<script src="data/cases-captures.js"></script>
<script src="data/cases-data.js"></script>

<script>
const badgeMap = {
  "网页游戏":"badge-game","多媒体":"badge-media",
  "互动体验":"badge-interactive","工具":"badge-tool"
};

// ===== SIMPLE MARKDOWN RENDERER =====
function renderMarkdown(text) {
  if (!text) return '';
  let html = text;

  // Escape HTML first (but preserve markdown)
  html = html.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // Code blocks (``` ... ```)
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
    return '<pre><code>' + code.trim() + '</code></pre>';
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headers
  html = html.replace(/^#### (.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

  // Bold
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Blockquote
  html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

  // Horizontal rule
  html = html.replace(/^---$/gm, '<hr>');

  // Tables
  html = html.replace(/^\|(.+)\|$/gm, function(match, row) {
    const cells = row.split('|').map(c => c.trim());
    // Check if separator row
    if (cells.every(c => /^[-:]+$/.test(c))) return '';
    const tag = 'td';
    const tag2 = 'td';
    return '<tr><' + tag2 + '>' + cells.join('</' + tag2 + '><' + tag2 + '>') + '</' + tag2 + '>';
  });
  // Wrap tables in table tag
  if (html.includes('<tr>')) {
    html = html.replace(/(<tr>[\s\S]*?<\/tr>)/g, '<table>$1</table>');
  }

  // Unordered lists
  html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>[\s\S]*?<\/li>)/g, function(block) {
    if (block.includes('<li>')) return '<ul>' + block + '</ul>';
    return block;
  });

  // Ordered lists
  html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');

  // Line breaks → paragraphs
  html = html.split('\n\n').map(block => {
    block = block.trim();
    if (!block) return '';
    // Don't wrap pre-existing block elements
    if (block.startsWith('<h') || block.startsWith('<ul') || block.startsWith('<ol') ||
        block.startsWith('<li>') || block.startsWith('<table') || block.startsWith('<pre') ||
        block.startsWith('<blockquote') || block.startsWith('<hr')) {
      return block;
    }
    return '<p>' + block.replace(/\n/g, '<br>') + '</p>';
  }).join('\n');

  // Clean up empty paragraphs
  html = html.replace(/<p>\s*<\/p>/g, '');

  return html;
}

function switchLang(lang) {
  currentLang = lang;
  localStorage.setItem('pilotdeck_lang', lang);
  localStorage.setItem('case_square_lang', lang);
  // Update lang switch buttons
  document.querySelectorAll('#langSwitch button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
  // Update all data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (I18N[lang][key] !== undefined) {
      el.textContent = I18N[lang][key];
    }
  });
  // Re-render cards and detail if active
  renderHome();
  const hash = location.hash.replace('#', '');
  if (hash && CASES.find(c => c.id === hash)) {
    showDetail(hash);
  }
}

function t(key) { return I18N[currentLang][key] || key; }

// ===== HOME VIEW =====
function renderHome(){
  const grid = document.getElementById('cardGrid');
  grid.innerHTML = '';

  CASES.forEach(c => {
    const capture = CASES_CAPTURES[c.id] || '';
    const hasPreview = c.preview && !c.preview.externalUrl;
    const name = currentLang === 'en' && c.nameEn ? c.nameEn : c.name;
    const desc = currentLang === 'en' && c.descriptionEn ? c.descriptionEn : c.description;
    const badgeLabel = currentLang === 'en' && c.categoryEn ? c.categoryEn : c.category;
    const label = c.preview && c.preview.labelEn && currentLang === 'en' ? c.preview.labelEn : c.preview?.label;

    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => showDetail(c.id);

    let previewHtml = '';
    if (hasPreview) {
      const p = c.preview;
      const iframeUrl = getPreviewUrl(p.project, p.file);
      const thumbUrl = c.thumbnail ? getPreviewUrl(p.project, c.thumbnail) : null;
      if (thumbUrl) {
        previewHtml = `
        <div class="card-preview">
          <img class="card-thumb" src="${thumbUrl}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="${escapeHtml(name)}">
          <div class="card-preview-fallback" style="display:none;">${capture}</div>
          <div class="card-preview-label">
            <span class="card-label-icon">🔗</span> ${escapeHtml(label || '')}
          </div>
        </div>`;
      } else {
        previewHtml = `
        <div class="card-preview">
          <iframe src="" loading="lazy"></iframe>
          <div class="card-preview-fallback">${capture}</div>
          <div class="card-preview-label">
            <span class="card-label-icon">🔗</span> ${escapeHtml(label || '')}
          </div>
        </div>`;
      }
    } else if (c.preview && c.preview.externalUrl) {
      previewHtml = `
        <div class="card-preview">
          <img src="" style="width:100%;height:100%;object-fit:cover;display:none;">
          <div class="card-preview-fallback">${capture}</div>
          <div class="card-preview-label">
            <span class="card-label-icon">🌐</span> ${escapeHtml(label || '')}
          </div>
        </div>`;
    } else {
      previewHtml = `
        <div class="card-preview">
          <div class="card-preview-fallback">${capture}</div>
          <div class="card-preview-label">
            <span class="card-label-icon">📄</span> ${I18N[currentLang].sourceCode}
          </div>
        </div>`;
    }

    card.innerHTML = `
      ${previewHtml}
      <div class="card-info">
        <div class="card-top">
          <div class="card-title">${escapeHtml(name)}</div>
          <span class="card-badge ${badgeMap[c.category]||''}">${escapeHtml(badgeLabel)}</span>
        </div>
        <div class="card-desc">${escapeHtml(desc)}</div>
      </div>`;
    grid.appendChild(card);

    if (hasPreview) {
      const iframe = card.querySelector('iframe');
      if (iframe) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              iframe.src = getPreviewUrl(c.preview.project, c.preview.file);
              observer.unobserve(entry.target);
            }
          });
        }, { rootMargin: '200px' });
        observer.observe(card);
      }
    }
  });
}

// ===== DETAIL VIEW =====
function showDetail(caseId){
  const c = CASES.find(x=>x.id===caseId);
  if(!c) return;

  location.hash = caseId;
  document.getElementById('homeView').style.display='none';
  document.getElementById('detailView').classList.add('active');
  document.getElementById('backBtn').classList.add('visible');
  document.body.classList.add('detail-mode');

  const dataItem = CASES_DATA.find(x=>x.id===caseId);
  const steps = dataItem ? dataItem.steps : (c.steps || []);

  const capture = CASES_CAPTURES[c.id]||'';
  const flowchart = FLOWCHARTS[c.id]||'';
  const badgeCls = badgeMap[c.category]||'';
  const left = document.getElementById('detailLeft');

  const name = currentLang === 'en' && c.nameEn ? c.nameEn : c.name;
  const desc = currentLang === 'en' && c.descriptionEn ? c.descriptionEn : c.description;
  const label = c.preview && c.preview.labelEn && currentLang === 'en' ? c.preview.labelEn : c.preview?.label;

  // Build hero: embed iframe for HTML projects, screenshot for others
  let heroHtml = capture;
  let heroSrc = null;
  if (c.preview && !c.preview.externalUrl && c.preview.file && (c.preview.type === 'html' || !c.preview.type)) {
    heroSrc = getPreviewUrl(c.preview.project, c.preview.file);
    heroHtml = `<iframe src="" sandbox="allow-scripts allow-popups allow-forms " loading="eager"></iframe>`;
  } else if (c.thumbnail) {
    const thumbUrl = getPreviewUrl(c.preview.project, c.thumbnail);
    heroHtml = `<img src="${thumbUrl}" alt="${escapeHtml(name)}" style="width:100%;height:100%;object-fit:cover;">`;
  } else if (c.preview && c.preview.externalUrl) {
    heroHtml = `<img src="" style="width:100%;height:100%;object-fit:cover;display:none;">`;
  }

  let actionsHtml = '';
  if(c.preview){
    if(!c.preview.externalUrl){
      const btnUrl = getPreviewUrl(c.preview.project, c.preview.file);
      actionsHtml += `<button class="btn-preview" onclick="updateHeroIframe('${btnUrl}')">${escapeHtml(label || '')}</button>`;
    }
    if(c.preview.variants && c.preview.variants.length>0){
      const cidx = CASES.indexOf(c);
      const mainPath = c.preview.file;
      c.preview.variants.forEach((v,vi)=>{
        if(v.path === mainPath) return; // skip duplicate
        const vLabel = currentLang === 'en' && v.langEn ? v.langEn : (v.lang||v.label);
        actionsHtml += `<button class="btn-variant" onclick="openPreviewVariant(${cidx},${vi})">${escapeHtml(vLabel)}</button>`;
      });
    }
    if(c.preview.externalUrl){
      actionsHtml += `<button class="btn-preview" onclick="window.open('${escapeAttr(c.preview.externalUrl)}','_blank')">${escapeHtml(label || '')}</button>`;
    }
  }

  let flowchartHtml = '';
  if(flowchart){
    flowchartHtml = `
      <div class="detail-section-title" style="margin-top:1.5rem;">${I18N[currentLang].flowchartTitle}</div>
      <div class="detail-flowchart">${flowchart}</div>`;
  }

  left.innerHTML = `
    <div class="detail-hero-capture">${heroHtml}</div>
    <div class="detail-name">${escapeHtml(name)}</div>
    <span class="card-badge ${badgeCls}" style="font-size:.8rem;padding:.3rem .8rem;">${currentLang === 'en' && c.categoryEn ? c.categoryEn : c.category}</span>
    <p class="detail-desc">${escapeHtml(desc)}</p>
    <div class="detail-stats">
      <div class="stat-card"><div class="stat-num">${c.stats.user_turns}</div><div class="stat-label">${I18N[currentLang].statUser}</div></div>
      <div class="stat-card"><div class="stat-num">${c.stats.assistant_turns}</div><div class="stat-label">${I18N[currentLang].statAi}</div></div>
      <div class="stat-card"><div class="stat-num">${c.stats.tool_calls}</div><div class="stat-label">${I18N[currentLang].statTool}</div></div>
    </div>
    <div class="detail-actions">${actionsHtml}</div>
    ${flowchartHtml}
  `;

  // Set iframe src after DOM is inserted
  if (heroSrc) {
    const iframe = left.querySelector('iframe');
    if (iframe) iframe.src = heroSrc;
  }

  // Right panel — chat
  const recordText = currentLang === 'en' ? `${steps.length} ${I18N[currentLang].recordCount.trim()}` : `${steps.length} 条交互记录`;
  document.getElementById('sessionBadge').textContent = recordText;

  const chat = document.getElementById('chatMessages');
  chat.innerHTML = '';
  chat.scrollTop = 0;

  // Get highlighted_steps for this case
  const highlighted = c.highlighted_steps || [];

  if (highlighted.length > 0) {
    highlighted.forEach((s, i) => {
      const stepTitle = currentLang === 'en' && s.titleEn ? s.titleEn : s.title;
      const stepContent = currentLang === 'en' && s.contentEn ? s.contentEn : s.content;

      if (s.type === 'tool') {
        const div = document.createElement('div');
        div.className = 'msg-tool';
        div.style.animationDelay = `${i * 50}ms`;

        const summaryText = stepContent.length > 80 ? stepContent.substring(0, 80) + '…' : stepContent;

        div.innerHTML = `
          <div class="tool-header" onclick="toggleTool(this)">
            <span class="tool-toggle">▶</span>
            <span class="tool-icon">🔧</span>
            <span class="tool-title">${escapeHtml(stepTitle)}</span>
            <span class="tool-summary">${escapeHtml(summaryText)}</span>
          </div>
          <div class="tool-body">${escapeHtml(stepContent)}</div>`;
        chat.appendChild(div);
      } else {
        const div = document.createElement('div');
        let typeClass = 'msg-assistant';
        if (s.type === 'user') typeClass = 'msg-user';
        else if (s.type === 'summary') typeClass = 'msg-summary';
        div.className = `msg ${typeClass}`;
        div.style.animationDelay = `${i * 50}ms`;

        if (typeClass === 'msg-user') {
          div.innerHTML = `
            <div class="msg-title">${escapeHtml(stepTitle)}</div>
            <div class="msg-body">${escapeHtml(stepContent)}</div>`;
        } else if (typeClass === 'msg-assistant') {
          div.innerHTML = `
            <div class="msg-bubble">
              <div class="msg-title">${escapeHtml(stepTitle)}</div>
              <div class="msg-body">${renderMarkdown(stepContent)}</div>
            </div>`;
        } else {
          div.innerHTML = `
            <div class="msg-title">${escapeHtml(stepTitle)}</div>
            <div class="msg-body">${escapeHtml(stepContent)}</div>`;
        }
        chat.appendChild(div);
      }
    });
  } else if (steps.length > 0) {
    // Fallback: render full steps from CASES_DATA
    steps.forEach((s, i) => {
      const title = s.title || '';
      const content = s.content || '';

      if (s.type === 'tool') {
        const div = document.createElement('div');
        div.className = 'msg-tool';
        div.style.animationDelay = `${i * 50}ms`;
        const summaryText = content.length > 80 ? content.substring(0, 80) + '…' : content;
        div.innerHTML = `
          <div class="tool-header" onclick="toggleTool(this)">
            <span class="tool-toggle">▶</span>
            <span class="tool-icon">🔧</span>
            <span class="tool-title">${escapeHtml(title)}</span>
            <span class="tool-summary">${escapeHtml(summaryText)}</span>
          </div>
          <div class="tool-body">${escapeHtml(content)}</div>`;
        chat.appendChild(div);
      } else {
        const div = document.createElement('div');
        let typeClass = 'msg-assistant';
        if (s.type === 'user') typeClass = 'msg-user';
        else if (s.type === 'summary') typeClass = 'msg-summary';
        div.className = `msg ${typeClass}`;
        div.style.animationDelay = `${i * 50}ms`;

        if (typeClass === 'msg-user') {
          div.innerHTML = `
            <div class="msg-title">${escapeHtml(title)}</div>
            <div class="msg-body">${escapeHtml(content)}</div>`;
        } else if (typeClass === 'msg-assistant') {
          div.innerHTML = `
            <div class="msg-bubble">
              <div class="msg-title">${escapeHtml(title)}</div>
              <div class="msg-body">${renderMarkdown(content)}</div>
            </div>`;
        } else {
          div.innerHTML = `
            <div class="msg-title">${escapeHtml(title)}</div>
            <div class="msg-body">${escapeHtml(content)}</div>`;
        }
        chat.appendChild(div);
      }
    });
  }
}

function goHome(){
  location.hash = '';
  document.getElementById('homeView').style.display='block';
  document.getElementById('detailView').classList.remove('active');
  document.getElementById('backBtn').classList.remove('visible');
  document.body.classList.remove('detail-mode');
}

// ===== TOOL COLLAPSE TOGGLE =====
function toggleTool(headerEl) {
  const toggle = headerEl.querySelector('.tool-toggle');
  const body = headerEl.nextElementSibling;
  toggle.classList.toggle('open');
  body.classList.toggle('open');
}

// ===== ROUTER =====
function router(){
  const hash = location.hash.replace('#','');
  if(hash && CASES.find(c=>c.id===hash)){
    showDetail(hash);
  } else {
    goHome();
  }
}
window.addEventListener('hashchange', router);

// ===== PREVIEW FUNCTIONS =====
function getPreviewUrl(project, file) {
  // project param kept for backward compat but no longer used
  return file;
}
function updateHeroIframe(url){
  const iframe = document.querySelector('.detail-hero-capture iframe');
  if(iframe) iframe.src = url;
  else showPreviewFrame(url);
}

function openPreviewVariant(cidx,vi){
  const c = CASES[cidx];
  if(!c||!c.preview)return;
  const variant = c.preview.variants[vi];
  if(!variant)return;
  const fullFile = variant.path;
  const resolvedUrl = getPreviewUrl(c.preview.project, fullFile);
  if(variant.path.endsWith('.pdf')||variant.path.endsWith('.tex')){window.open(resolvedUrl,'_blank');}
  else if(document.getElementById('detailView').classList.contains('active')){
    // Update hero iframe in detail view
    const iframe = document.querySelector('.detail-hero-capture iframe');
    if(iframe) iframe.src = resolvedUrl;
  }
  else{showPreviewFrame(resolvedUrl);}
}

// ===== INIT =====
function init(){
  // Restore saved language preference (sync with main site)
  const saved = localStorage.getItem('pilotdeck_lang') || localStorage.getItem('case_square_lang');
  if (saved) currentLang = saved;
  // Set initial lang switch state
  document.querySelectorAll('#langSwitch button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === currentLang);
  });
  // Apply initial i18n
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (I18N[currentLang][key] !== undefined) {
      el.textContent = I18N[currentLang][key];
    }
  });
  // Render
  renderHome();
  router();
}

function showPreviewFrame(url){
  let overlay = document.getElementById('previewOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'previewOverlay';
    overlay.className = 'preview-overlay';
    overlay.innerHTML = `
      <div class="preview-bar">
        <div style="display:flex;align-items:center;gap:.75rem;">
          <button onclick="closePreview()" style="background:transparent;border:1px solid #d1d5db;color:#374151;padding:.35rem .9rem;border-radius:8px;cursor:pointer;font-size:.82rem;display:flex;align-items:center;gap:.3rem;">&#8592; <span data-i18n="back">返回</span></button>
          <span style="color:var(--text-dim);font-size:.85rem;">🔗 <span data-i18n="previewMode">预览模式</span></span>
          <a id="previewExternalLink" href="" target="_blank" style="color:var(--accent2);font-size:.8rem;text-decoration:none;">↗ <span data-i18n="newWindow">新窗口打开</span></a>
        </div>
        <button onclick="closePreview()" style="background:rgba(255,255,255,.1);border:none;color:#fff;padding:.4rem 1rem;border-radius:8px;cursor:pointer;font-size:.85rem;">✕ <span data-i18n="closePreview">关闭预览</span></button>
      </div>
      <iframe id="previewFrame" src="" sandbox="allow-scripts allow-popups allow-forms"></iframe>`;
    document.body.appendChild(overlay);
  }
  const frame = document.getElementById('previewFrame');
  const extLink = document.getElementById('previewExternalLink');
  frame.src = url;
  extLink.href = url;
  overlay.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closePreview(){
  const overlay = document.getElementById('previewOverlay');
  if(overlay) overlay.style.display = 'none';
  const frame = document.getElementById('previewFrame');
  if(frame) frame.src = '';
  document.body.style.overflow = '';
}

// ===== UTILITY =====
function escapeHtml(t){
  return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escapeAttr(t){
  return String(t).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Init
renderHome();
router();
</script>
