<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="500" height="320">
  <rect width="500" height="320" fill="#f8fafc"/>
  <!-- HTML whitepaper sheet -->
  <g>
    <rect x="80" y="40" width="220" height="240" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
    <rect x="100" y="60" width="140" height="14" rx="2" fill="#0f172a"/>
    <rect x="100" y="84" width="180" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="100" y="98" width="160" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="100" y="112" width="170" height="6" rx="2" fill="#e5e7eb"/>
    <!-- chart -->
    <rect x="100" y="140" width="180" height="70" rx="4" fill="#eff6ff"/>
    <g fill="#2563eb">
      <rect x="112" y="180" width="14" height="22"/>
      <rect x="132" y="170" width="14" height="32"/>
      <rect x="152" y="158" width="14" height="44"/>
      <rect x="172" y="150" width="14" height="52"/>
      <rect x="192" y="166" width="14" height="36"/>
      <rect x="212" y="156" width="14" height="46"/>
      <rect x="232" y="148" width="14" height="54"/>
      <rect x="252" y="160" width="14" height="42"/>
    </g>
    <rect x="100" y="226" width="120" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="100" y="240" width="160" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="100" y="254" width="140" height="6" rx="2" fill="#e5e7eb"/>
  </g>
  <!-- LLM search query -->
  <g>
    <rect x="340" y="80" width="120" height="60" rx="10" fill="#fff" stroke="#94a3b8"/>
    <text x="352" y="104" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b">QUERY</text>
    <text x="352" y="124" font-family="-apple-system, sans-serif" font-size="10" fill="#0f172a">Chinese LLM</text>
    <text x="352" y="136" font-family="-apple-system, sans-serif" font-size="10" fill="#0f172a">market survey</text>
  </g>
  <g>
    <rect x="340" y="180" width="120" height="60" rx="10" fill="#000"/>
    <text x="352" y="204" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">OUTPUT</text>
    <text x="352" y="224" font-family="-apple-system, sans-serif" font-size="10" fill="#fff">whitepaper.html</text>
    <text x="352" y="236" font-family="-apple-system, sans-serif" font-size="10" fill="#22c55e"> 24 pages</text>
  </g>
  <path d="M 300 160 L 340 110" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3" fill="none"/>
  <path d="M 340 210 L 300 180" stroke="#2563eb" stroke-width="1.5" fill="none"/>
</svg>
