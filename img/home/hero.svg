<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="600" height="480">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f0f0f0"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#e5e7eb" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="600" height="480" fill="url(#bgGrad)"/>
  <rect width="600" height="480" fill="url(#grid)" opacity="0.6"/>

  <!-- Connecting lines between workspaces -->
  <g stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" fill="none">
    <path d="M 150 130 Q 250 60 380 110"/>
    <path d="M 380 110 Q 460 200 420 320"/>
    <path d="M 150 130 Q 100 240 180 360"/>
    <path d="M 180 360 Q 290 410 420 320"/>
  </g>

  <!-- WorkSpace card 1 (top-left, active) -->
  <g transform="translate(60 80)">
    <rect width="200" height="120" rx="14" fill="#ffffff" stroke="#000" stroke-width="2"/>
    <circle cx="20" cy="22" r="4" fill="#2563eb"/>
    <rect x="32" y="18" width="80" height="8" rx="2" fill="#111"/>
    <rect x="20" y="44" width="160" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="20" y="58" width="120" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="20" y="72" width="140" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="20" y="92" width="60" height="16" rx="4" fill="#000"/>
    <rect x="86" y="92" width="60" height="16" rx="4" fill="none" stroke="#e5e7eb"/>
  </g>

  <!-- WorkSpace card 2 (top-right) -->
  <g transform="translate(330 60)">
    <rect width="200" height="120" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="4" fill="#a3a3a3"/>
    <rect x="32" y="18" width="60" height="8" rx="2" fill="#a3a3a3"/>
    <rect x="20" y="44" width="160" height="50" rx="6" fill="#f4f4f5"/>
    <!-- memory bar -->
    <rect x="28" y="56" width="100" height="6" rx="2" fill="#2563eb"/>
    <rect x="28" y="68" width="70" height="6" rx="2" fill="#bfdbfe"/>
    <rect x="28" y="80" width="50" height="6" rx="2" fill="#bfdbfe"/>
    <rect x="20" y="104" width="100" height="8" rx="2" fill="#e5e7eb"/>
  </g>

  <!-- WorkSpace card 3 (bottom-left) -->
  <g transform="translate(80 300)">
    <rect width="200" height="120" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
    <!-- terminal style -->
    <rect width="200" height="28" rx="14" fill="#1e1e1e"/>
    <circle cx="14" cy="14" r="4" fill="#ff5f56"/>
    <circle cx="28" cy="14" r="4" fill="#ffbd2e"/>
    <circle cx="42" cy="14" r="4" fill="#27c93f"/>
    <text x="20" y="56" font-family="Menlo, monospace" font-size="11" fill="#525252">$ pilotdeck run</text>
    <text x="20" y="74" font-family="Menlo, monospace" font-size="11" fill="#2563eb">’ routing to sonnet</text>
    <text x="20" y="92" font-family="Menlo, monospace" font-size="11" fill="#525252">’ memory updated</text>
    <text x="20" y="110" font-family="Menlo, monospace" font-size="11" fill="#15803d"> task complete</text>
  </g>

  <!-- WorkSpace card 4 (bottom-right) -->
  <g transform="translate(360 260)">
    <rect width="200" height="120" rx="14" fill="#ffffff" stroke="#d4d4d8" stroke-width="1.5"/>
    <rect x="20" y="20" width="160" height="6" rx="2" fill="#111"/>
    <rect x="20" y="34" width="100" height="6" rx="2" fill="#e5e7eb"/>
    <!-- always-on clock badge -->
    <circle cx="170" cy="60" r="12" fill="#2563eb"/>
    <path d="M 170 53 L 170 60 L 175 60" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <rect x="20" y="56" width="120" height="6" rx="2" fill="#e5e7eb"/>
    <rect x="20" y="78" width="80" height="22" rx="11" fill="#dcfce7"/>
    <text x="32" y="94" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#15803d">Ï Always-on</text>
  </g>

  <!-- floating "WorkSpace" labels -->
  <g font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748b" letter-spacing="0.05em">
    <text x="60" y="72" text-transform="uppercase">PROJECT · A</text>
    <text x="330" y="52" text-transform="uppercase">MEMORY · B</text>
    <text x="80" y="292" text-transform="uppercase">SHELL · C</text>
    <text x="360" y="252" text-transform="uppercase">ALWAYS · D</text>
  </g>
</svg>
