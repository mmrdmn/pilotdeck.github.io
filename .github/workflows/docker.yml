name: Build & publish Docker image

# Builds a multi-arch (linux/amd64 + linux/arm64) image and pushes to
# GitHub Container Registry. Runs alongside the existing GitHub Pages
# deploy.yml — that one stays the source of truth for the live site;
# this workflow exists so self-hosters can pull a ready-made container.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased automatically by the action so user/org capitalisation
          # in the GitHub URL doesn't break the OCI image reference rules.
          images: ghcr.io/${{ github.repository_owner }}/pilotdeck-website
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend — first build cold, subsequent
          # builds reuse the npm install + vite build layers.
          cache-from: type=gha
          cache-to: type=gha,mode=max
