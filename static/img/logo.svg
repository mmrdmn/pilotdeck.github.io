<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" width="220" height="40">
  <g fill="none" stroke="none">
    <!-- Mark: three stacked workspace cards with one tilted (deck) -->
    <g transform="translate(2 4)">
      <rect x="2" y="6" width="22" height="22" rx="4" fill="#000"/>
      <rect x="6" y="2" width="22" height="22" rx="4" fill="#fff" stroke="#000" stroke-width="2"/>
      <circle cx="24" cy="6" r="3.5" fill="#2563eb"/>
    </g>
    <!-- Wordmark -->
    <text x="46" y="27"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="22" font-weight="800" fill="#000" letter-spacing="-0.5">
      Pilot<tspan fill="#2563eb">Deck</tspan>
    </text>
  </g>
</svg>
