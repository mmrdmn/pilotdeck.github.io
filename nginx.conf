# nginx site config for the PilotDeck documentation image.
#
# Serves three URL families under the /pilotdeck.github.io/ prefix:
#   - /pilotdeck.github.io/demo/*  — the V2 SPA (HTML5 history routing)
#   - /pilotdeck.github.io/docs/*  — Docusaurus pre-rendered pages
#   - /pilotdeck.github.io/        — landing + assets + everything else

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version in error pages and Server headers.
    server_tokens off;

    # ─── Compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/woff
        font/woff2;

    # ─── Hashed assets: long cache, immutable ─────────────────────────
    # Both Docusaurus (assets/*.<hash>.js|css) and the Vite demo
    # (demo/assets/*-<hash>.js|css) produce content-hashed filenames,
    # so a 1y cache is safe — fresh deploys ship new filenames.
    location ~* \.(?:js|mjs|css|woff2?|ttf|otf|eot|ico|svg|png|jpe?g|gif|webp|avif|map)$ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ─── HTML: short cache so content updates ship fast ───────────────
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # ─── V2 demo SPA: BrowserRouter fallback to its own index.html ────
    # Any deep link (e.g. /demo/p/general/c/<sid>) must serve the SPA
    # so React Router can resolve the route on the client side.
    location /pilotdeck.github.io/demo/ {
        try_files $uri $uri/ /pilotdeck.github.io/demo/index.html;
    }

    # ─── Docusaurus site: try the file, then dir/index, then .html ────
    # docusaurus.config.js uses trailingSlash:false, so docs pages are
    # emitted as `<path>.html` rather than `<path>/index.html`. Add the
    # `$uri.html` fallback so /docs/introduction resolves correctly.
    location /pilotdeck.github.io/ {
        try_files $uri $uri/ $uri.html /pilotdeck.github.io/404.html;
    }

    # Root landing (Dockerfile drops in a meta-refresh stub).
    location = / {
        try_files /index.html =404;
    }

    # Anything outside the baseUrl is a typo / probe → 404.
    location / {
        return 404;
    }
}
